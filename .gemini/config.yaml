have_fun: false
memory_config:
  disabled: false
code_review:
  disable: false
  comment_severity_threshold: LOW
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: false
ignore_patterns:
  - "build/**"
  - "**/build/**"
  - ".gradle/**"
  - "**/.gradle/**"
  - ".idea/**"
  - "captures/**"
  - ".cxx/**"
  - ".externalNativeBuild/**"
  - "gradle/wrapper/gradle-wrapper.jar"
  - "gradle.lockfile"
  - "**/gradle.lockfile"
  - "*.iml"
  - "**/*.iml"
  - "local.properties"
  - "**/generated/**"
  - "**/*.apk"
  - "**/*.aab"
  - "**/*.jar"
  - "**/*.png"
  - "**/*.webp"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.ttf"
  - "**/*.otf"
